name: Collect AI signals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: read

concurrency:
  group: ai-trend-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate required configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing Actions secret: SUPABASE_URL"
            exit 1
          fi
          if [ -z "$SUPABASE_SECRET_KEY" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing Actions secret: SUPABASE_SECRET_KEY"
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *)
              echo "::error::SUPABASE_URL must look like https://PROJECT_REF.supabase.co (without quotes or /rest/v1)"
              exit 1
              ;;
          esac
      - name: Collect sources
        env:
          PYTHONPATH: src
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          LOOKBACK_HOURS: "6"
          HN_ITEM_LIMIT: "120"
        run: python -m trend_tracker collect

name: Generate AI trend digest

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Generate and deliver again even if today's digest already exists"
        required: false
        default: false
        type: boolean
  schedule:
    # 06:53 and 07:53 Asia/Shanghai. GitHub schedule is not an exact-time SLA;
    # the second run is a fallback and database idempotency prevents duplicates.
    - cron: "53 22 * * *"
    - cron: "53 23 * * *"

permissions:
  contents: read

concurrency:
  group: ai-trend-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate delivery configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          FEEDBACK_SIGNING_SECRET: ${{ secrets.FEEDBACK_SIGNING_SECRET }}
          FEEDBACK_PAGE_URL: ${{ vars.FEEDBACK_PAGE_URL }}
          FEEDBACK_API_URL: ${{ vars.FEEDBACK_API_URL }}
        run: |
          if [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ]; then
            if [ -z "$RESEND_API_KEY" ] || [ -z "$DIGEST_FROM" ]; then
              echo "::error::Configure SMTP_USERNAME + SMTP_PASSWORD, or RESEND_API_KEY + DIGEST_FROM"
              exit 1
            fi
          fi
          PYTHONPATH=src python - <<'PY'
          from trend_tracker.config import Settings
          from trend_tracker.http import HttpClient
          from trend_tracker.repository import SupabaseRepository

          settings = Settings.from_env()
          settings.require_supabase()
          repository = SupabaseRepository(
              settings.supabase_url, settings.supabase_key, HttpClient()
          )
          users = repository.get_beta_users()
          beta_mode = bool(users) or repository.has_beta_users()
          feedback_enabled = settings.feedback_enabled
          if not beta_mode and not settings.digest_to:
              raise SystemExit(
                  "Add an active beta user in Supabase, or configure DIGEST_TO "
                  "for legacy personal mode"
              )
          print("Delivery mode:", "Supabase beta" if beta_mode else "legacy personal")
          print("Active beta users:", len(users))
          if beta_mode and not users:
              print("All beta users are paused; this run will send no digest.")
          print("Feedback:", "enabled" if feedback_enabled else "disabled")
          PY
      - name: Refresh sources before digest
        env:
          PYTHONPATH: src
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          LOOKBACK_HOURS: "30"
          HN_ITEM_LIMIT: "120"
        run: python -m trend_tracker collect
      - name: Generate digest
        env:
          PYTHONPATH: src
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHAT_API_KEY: ${{ secrets.CHAT_API_KEY }}
          CHAT_BASE_URL: ${{ vars.CHAT_BASE_URL }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS }}
          RANKING_MODEL: ${{ vars.RANKING_MODEL }}
          ANALYSIS_MODEL: ${{ vars.ANALYSIS_MODEL }}
          # Backward compatibility for existing OpenAI-only deployments.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          TRACKS_JSON: ${{ secrets.TRACKS_JSON }}
          BETA_MAX_USERS: ${{ vars.BETA_MAX_USERS || '20' }}
          BETA_MAX_TRACKS_PER_USER: ${{ vars.BETA_MAX_TRACKS_PER_USER || '3' }}
          FEEDBACK_SIGNING_SECRET: ${{ secrets.FEEDBACK_SIGNING_SECRET }}
          FEEDBACK_PAGE_URL: ${{ vars.FEEDBACK_PAGE_URL }}
          FEEDBACK_API_URL: ${{ vars.FEEDBACK_API_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          # Optional public CDN override. When empty, public GitHub repositories
          # automatically use immutable assets from the current commit SHA.
          DIGEST_ASSET_BASE_URL: ${{ vars.DIGEST_ASSET_BASE_URL }}
          LOOKBACK_HOURS: "30"
          OUTPUT_LANGUAGE: "zh-CN"
          REPORT_TIMEZONE: "Asia/Shanghai"
          REPORT_HIGHLIGHT_ITEMS: ${{ vars.REPORT_HIGHLIGHT_ITEMS || '3' }}
          REPORT_QUICK_ITEMS: ${{ vars.REPORT_QUICK_ITEMS || '12' }}
          REPORT_RELEVANCE_THRESHOLD: ${{ vars.REPORT_RELEVANCE_THRESHOLD || '50' }}
          REPORT_SHOW_SCORES: ${{ vars.REPORT_SHOW_SCORES || 'false' }}
          FORCE_DIGEST: "${{ inputs.force || false }}"
        run: python -m trend_tracker digest
      - name: Upload digest
        # Disabled by default. In a public repository, uploaded artifacts can be
        # downloaded by signed-in users with repository read access.
        if: vars.UPLOAD_REPORT_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-trend-digest-${{ github.run_id }}
          path: reports/*.md
          retention-days: 30
